<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0c0f'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H33z' fill='%2331d0a0'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0a0c0f; --panel:#141820; --line:#262d38; --text:#eef1f5; --muted:#8a95a5; --accent:#31d0a0; }
  * { box-sizing: border-box; }
  html { font-size: clamp(16px, 1.2vw, 24px); }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(1200px 600px at 50% -10%, #12302a 0%, var(--bg) 60%); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width:min(26rem, 90vw); background:var(--panel); border:1px solid var(--line); border-radius:1.2rem; padding:2rem; }
  .bolt { width:3rem; height:3rem; margin-bottom:.8rem; }
  h1 { margin:0 0 .3rem; font-size:1.6rem; }
  p { margin:0 0 1.4rem; color:var(--muted); }
  input { width:100%; font:inherit; font-size:1.2rem; padding:1rem 1.1rem; border-radius:.8rem; border:1px solid var(--line); background:#0d1015; color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  button { width:100%; margin-top:1rem; font:inherit; font-size:1.2rem; font-weight:650; padding:1rem; border:0; border-radius:.8rem; background:var(--accent); color:#04120d; cursor:pointer; }
  .err { color:#ff8a8a; margin:0 0 1rem; display:none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <svg class="bolt" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0c0f" stroke="#262d38"/><path d="M36 8 18 36h12l-4 20 20-30H33z" fill="#31d0a0"/></svg>
  <h1>Charge Theatre</h1>
  <p>Enter the password to continue.</p>
  <div class="err" id="err"></div>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
</form>
<script>
  var e = new URLSearchParams(location.search).get('e');
  if (e) { var el = document.getElementById('err'); el.style.display = 'block'; el.textContent = e === '2' ? 'Too many attempts. Wait a few minutes.' : 'Wrong password.'; }
</script>
</body>
</html>
